name: Build RokuPowerService

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [x64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to Path
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (${{ matrix.configuration }} | ${{ matrix.platform }})
      run: msbuild RokuPowerService.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RokuPowerService-${{ matrix.platform }}-${{ matrix.configuration }}
        path: Build/${{ matrix.platform }}/${{ matrix.configuration }}/RokuPowerService.exe
